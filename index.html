<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bingo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #0d1b2a;
            background-image: url('background.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: #e0f2fe;
            margin: 0;
            padding-top: 180px;
            min-height: 100vh;
        }

        h1 {
            display: none;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background: linear-gradient(135deg, #007ea7, #003459);
            color: #ffd700; /* Gold text to match title */
            border: 2px solid #00a8e8;
            border-radius: 8px;
            margin-bottom: 30px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 168, 232, 0.5);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px black;
        }

        button:hover {
            background: linear-gradient(135deg, #00a8e8, #007ea7);
            box-shadow: 0 0 25px rgba(0, 168, 232, 0.8);
            transform: translateY(-2px);
        }

        /* The 4x4 grid */
        #bingo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px; /* Reduced gap to align better with the image's internal grid */
            width: 90%;
            max-width: 600px;
            background: transparent; /* Let the background frame show through */
            padding: 10px;
        }

        /* Cell style */
        .cell {
            aspect-ratio: 1; /* Keeps the square shape */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(13, 27, 42, 0.6); /* Translucent dark blue */
            color: #e0f2fe; /* Light icy blue text */
            border: 1px solid rgba(0, 168, 232, 0.3); /* Subtle icy border */
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            padding: 8px;
            user-select: none;
            transition: all 0.2s ease-in-out;
            backdrop-filter: blur(2px);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .cell:hover {
            background: rgba(0, 126, 167, 0.5);
            border-color: rgba(0, 168, 232, 0.8);
            box-shadow: 0 0 10px rgba(0, 168, 232, 0.4);
        }

        /* Style when the cell is clicked (checked) */
        .cell.checked {
            background: rgba(0, 168, 232, 0.7); /* Bright icy blue */
            color: #ffffff;
            border-color: #ffffff;
            transform: scale(0.95);
            box-shadow: 0 0 20px #00a8e8, inset 0 0 15px rgba(255,255,255,0.4);
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <h1>Bingo - Ongoing Event</h1>
    <button onclick="generateGrid()">Generate a new grid</button>
    
    <div id="bingo-grid"></div>

    <script>
        // 1. Your list of placeholders. 
        // Put more than 16 to make the randomness interesting!
        const placeholders = [
            "electro asks for frostars", "hound use angry cat", "Challenge C", "Challenge D",
            "Challenge E", "Challenge F", "Challenge G", "Challenge H",
            "Challenge I", "Challenge J", "Challenge K", "Challenge L",
            "Challenge M", "Challenge N", "Challenge O", "Challenge P",
            "Challenge Q", "Challenge R", "Challenge S", "Challenge T"
        ];

        // 2. Function to shuffle an array (Fisher-Yates Algorithm)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 3. Function to generate the grid
        function generateGrid() {
            const container = document.getElementById("bingo-grid");
            container.innerHTML = ""; // Empty the grid in case we regenerate

            // Shuffle the list and only get the first 16 elements
            const selectedCells = shuffle([...placeholders]).slice(0, 16);

            // Create each cell in HTML
            selectedCells.forEach(text => {
                const cellDiv = document.createElement("div");
                cellDiv.classList.add("cell");
                cellDiv.textContent = text;

                // Add the click action to check/uncheck
                cellDiv.addEventListener("click", () => {
                    cellDiv.classList.toggle("checked");
                });

                container.appendChild(cellDiv);
            });
        }

        // 4. Generate the very first grid on page load
        generateGrid();
    </script>
</body>
</html>
