<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bingo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 */
            background-image: url('background.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        h1 { display: none; }

        #bingo-grid {
            position: absolute;
            top: 14%;
            left: 14%;
            width: 73%;
            height: 85%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            transform: scale(0.75);
            transform-origin: center;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(13, 27, 42, 0.15); /* Very subtle to show lines */
            color: #e0f2fe;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1vw;
            padding: 5px;
            user-select: none;
            transition: all 0.2s ease-in-out;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        @media (min-aspect-ratio: 16/9) {
            .cell {
                font-size: 1.95vh;
            }
        }

        .cell:hover {
            background: rgba(0, 126, 167, 0.3);
            box-shadow: inset 0 0 10px rgba(0, 168, 232, 0.5);
        }

        .cell.checked {
            background: rgba(0, 168, 232, 0.6);
            color: #ffffff;
            transform: scale(0.96);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.4);
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Pseudo Modal */
        #pseudo-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        #pseudo-popup {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 3px solid #00a8e8;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 40px #00a8e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popupIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #pseudo-popup h2 {
            color: #ffd700;
            font-size: 2.5em;
            margin: 0 0 20px 0;
            text-shadow: 0 0 15px #ffb703;
            text-transform: uppercase;
        }

        #pseudo-input {
            padding: 15px;
            font-size: 20px;
            border-radius: 5px;
            border: 2px solid #00a8e8;
            background: #001219;
            color: white;
            outline: none;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
        }

        #pseudo-popup button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #007ea7, #003459);
            color: #ffd700;
            border: 2px solid #00a8e8;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 168, 232, 0.5);
            transition: all 0.3s ease;
        }

        #pseudo-popup button:hover {
            background: linear-gradient(135deg, #00a8e8, #007ea7);
            box-shadow: 0 0 25px rgba(0, 168, 232, 0.8);
            transform: translateY(-2px);
        }

        /* Win Popup Styles */
        #win-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        #win-popup {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 3px solid #00a8e8;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 40px #00a8e8, inset 0 0 20px rgba(0, 168, 232, 0.4);
            animation: popupIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #win-popup h2 {
            color: #ffd700;
            font-size: 3em;
            margin: 0 0 30px 0;
            text-shadow: 0 0 20px #ffb703;
            text-transform: uppercase;
        }

        #win-popup button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #007ea7, #003459);
            color: #ffd700;
            border: 2px solid #00a8e8;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 168, 232, 0.5);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px black;
        }

        #win-popup button:hover {
            background: linear-gradient(135deg, #00a8e8, #007ea7);
            box-shadow: 0 0 25px rgba(0, 168, 232, 0.8);
            transform: translateY(-2px);
        }

        @keyframes popupIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #secret-admin-btn {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5%;
            height: 8%;
            background: transparent;
            border: none;
            cursor: default;
            z-index: 100;
            outline: none;
        }
    </style>
</head>
<body>


    <!-- Pseudo Overlay -->
    <div id="pseudo-overlay">
        <div id="pseudo-popup">
            <h2>Enter Pseudo</h2>
            <input type="text" id="pseudo-input" placeholder="Pseudo..." maxlength="15">
            <button onclick="submitPseudo()">Start Playing</button>
        </div>
    </div>

    <!-- Win Popup Overlay -->
    <div id="win-overlay">
        <div id="win-popup">
            <h2>You Won!</h2>
            <button onclick="closePopupAndRegenerate()">Play Again</button>
        </div>
    </div>

    <div id="game-container">
        <h1>Bingo - Ongoing Event</h1>
        <button id="secret-admin-btn" onclick="window.location.href='admin.html'" title=""></button>
        <div id="bingo-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV_UpfbqOAW7EoymmlOFuTqdgVZmrEtqo",
            authDomain: "drg-tyrant-bingo.firebaseapp.com",
            databaseURL: "https://drg-tyrant-bingo-default-rtdb.firebaseio.com",
            projectId: "drg-tyrant-bingo",
            storageBucket: "drg-tyrant-bingo.firebasestorage.app",
            messagingSenderId: "470680149909",
            appId: "1:470680149909:web:737039bc8dc9c883cfe09c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let playerPseudo = null;

        window.submitPseudo = () => {
            const input = document.getElementById('pseudo-input').value.trim();
            if (input.length > 0) {
                playerPseudo = input;
                document.getElementById('pseudo-overlay').style.display = 'none';
                updateScore(0);
            } else {
                alert("Please enter a pseudo!");
            }
        };

        function updateScore(score) {
            if (!playerPseudo) return;
            set(ref(db, 'scores/' + playerPseudo), {
                score: score,
                timestamp: Date.now()
            });
        }

        const placeholders = [
            "electro asks for frostars", "hound use angry cat", "Challenge C", "Challenge D",
            "Challenge E", "Challenge F", "Challenge G", "Challenge H",
            "Challenge I", "Challenge J", "Challenge K", "Challenge L",
            "Challenge M", "Challenge N", "Challenge O", "Challenge P",
            "Challenge Q", "Challenge R", "Challenge S", "Challenge T"
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateGrid() {
            const container = document.getElementById("bingo-grid");
            container.innerHTML = "";
            const selectedCells = shuffle([...placeholders]).slice(0, 16);

            selectedCells.forEach(text => {
                const cellDiv = document.createElement("div");
                cellDiv.classList.add("cell");
                cellDiv.textContent = text;

                cellDiv.addEventListener("click", () => {
                    cellDiv.classList.toggle("checked");
                    
                    const checkedCells = document.querySelectorAll('.cell.checked').length;
                    updateScore(checkedCells); // Send score in real-time

                    if (checkedCells === 16) {
                        setTimeout(() => {
                            document.getElementById('win-overlay').style.display = 'flex';
                        }, 400);
                    }
                });
                container.appendChild(cellDiv);
            });
        }

        window.closePopupAndRegenerate = () => {
            document.getElementById('win-overlay').style.display = 'none';
            generateGrid();
            updateScore(0); // Reset score on new grid
        };

        generateGrid();
    </script>
</body>
</html>
