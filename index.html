<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bingo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50; /* Nice background color for gaming */
            color: white;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        button:hover {
            background-color: #c0392b;
        }

        /* The 4x4 grid */
        #bingo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 500px;
        }

        /* Cell style */
        .cell {
            aspect-ratio: 1; /* Keeps the square shape */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #ecf0f1;
            color: #333;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            padding: 5px;
            user-select: none; /* Prevents text selection on double click */
            transition: all 0.2s ease-in-out;
        }

        /* Style when the cell is clicked (checked) */
        .cell.checked {
            background-color: #2ecc71; /* Validation green */
            color: white;
            border-color: #27ae60;
            transform: scale(0.95); /* Small click effect */
        }
    </style>
</head>
<body>

    <h1>Bingo - Ongoing Event</h1>
    <button onclick="generateGrid()">Generate a new grid</button>
    
    <div id="bingo-grid"></div>

    <script>
        // 1. Your list of placeholders. 
        // Put more than 16 to make the randomness interesting!
        const placeholders = [
            "electro asks for frostars", "Challenge B", "Challenge C", "Challenge D",
            "Challenge E", "Challenge F", "Challenge G", "Challenge H",
            "Challenge I", "Challenge J", "Challenge K", "Challenge L",
            "Challenge M", "Challenge N", "Challenge O", "Challenge P",
            "Challenge Q", "Challenge R", "Challenge S", "Challenge T"
        ];

        // 2. Function to shuffle an array (Fisher-Yates Algorithm)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 3. Function to generate the grid
        function generateGrid() {
            const container = document.getElementById("bingo-grid");
            container.innerHTML = ""; // Empty the grid in case we regenerate

            // Shuffle the list and only get the first 16 elements
            const selectedCells = shuffle([...placeholders]).slice(0, 16);

            // Create each cell in HTML
            selectedCells.forEach(text => {
                const cellDiv = document.createElement("div");
                cellDiv.classList.add("cell");
                cellDiv.textContent = text;

                // Add the click action to check/uncheck
                cellDiv.addEventListener("click", () => {
                    cellDiv.classList.toggle("checked");
                });

                container.appendChild(cellDiv);
            });
        }

        // 4. Generate the very first grid on page load
        generateGrid();
    </script>
</body>
</html>
