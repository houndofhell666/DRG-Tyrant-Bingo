<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bingo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            color: #e0f2fe;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        h1 {
            color: #ffd700;
            font-size: 3em;
            text-transform: uppercase;
            text-shadow: 0 0 20px #ffb703;
            margin-bottom: 40px;
        }

        #leaderboard-container {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 3px solid #00a8e8;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 40px rgba(0, 168, 232, 0.4);
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 15px;
            background: rgba(0, 168, 232, 0.1);
            border: 1px solid rgba(0, 168, 232, 0.3);
            border-radius: 8px;
            font-size: 1.2em;
            transition: all 0.3s ease;
        }

        .player-row:hover {
            background: rgba(0, 168, 232, 0.3);
            transform: translateX(5px);
        }

        .player-name {
            font-weight: bold;
            color: #ffffff;
        }

        .player-score {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.4em;
            text-shadow: 0 0 10px #ffb703;
        }

        .rank {
            color: #00a8e8;
            margin-right: 15px;
            font-size: 1.2em;
        }

        .actions {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        button, a.btn {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #007ea7, #003459);
            color: #ffd700;
            border: 2px solid #00a8e8;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 168, 232, 0.5);
            transition: all 0.3s ease;
        }

        button:hover, a.btn:hover {
            background: linear-gradient(135deg, #00a8e8, #007ea7);
            box-shadow: 0 0 25px rgba(0, 168, 232, 0.8);
            transform: translateY(-2px);
        }
        
        #btn-reset {
            background: linear-gradient(135deg, #9b2226, #660708);
            border-color: #ca6702;
            color: #ffb703;
            box-shadow: 0 0 15px rgba(202, 103, 2, 0.5);
        }
        
        #btn-reset:hover {
            background: linear-gradient(135deg, #ae2012, #9b2226);
            box-shadow: 0 0 25px rgba(202, 103, 2, 0.8);
        }

        .empty-msg {
            text-align: center;
            color: #8bb1c6;
            font-style: italic;
        }

        /* Password Overlay */
        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        #password-box {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 3px solid #ca6702;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 40px rgba(202, 103, 2, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #password-box h2 {
            color: #ffb703;
            margin-top: 0;
            text-transform: uppercase;
        }

        #password-input {
            padding: 15px;
            font-size: 20px;
            border-radius: 5px;
            border: 2px solid #ca6702;
            background: #001219;
            color: white;
            outline: none;
            margin-bottom: 25px;
            text-align: center;
        }

        #password-box button {
            border-color: #ca6702;
            color: #ffb703;
            background: linear-gradient(135deg, #9b2226, #660708);
            box-shadow: 0 0 15px rgba(202, 103, 2, 0.5);
        }

        #password-box button:hover {
            background: linear-gradient(135deg, #ae2012, #9b2226);
            box-shadow: 0 0 25px rgba(202, 103, 2, 0.8);
        }
    </style>
</head>
<body>
    <!-- Password Overlay -->
    <div id="password-overlay">
        <div id="password-box">
            <h2>Admin Access</h2>
            <input type="password" id="password-input" placeholder="Password...">
            <button onclick="checkPassword()">Login</button>
        </div>
    </div>

    <h1>Bingo Leaderboard</h1>

    <div id="leaderboard-container">
        <div id="leaderboard-list">
            <div class="empty-msg">Waiting for players to join...</div>
        </div>
    </div>

    <div class="actions">
        <button id="btn-reset">Reset All Scores</button>
        <a href="index.html" class="btn">Return to Game</a>
    </div>

    <script type="module">
        window.checkPassword = () => {
            const input = document.getElementById('password-input').value;
            if (input === 'Pj4Ever<3') {
                document.getElementById('password-overlay').style.display = 'none';
            } else {
                alert('Access Denied: Incorrect Password');
            }
        };

        // Allow pressing Enter to submit
        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.checkPassword();
        });

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV_UpfbqOAW7EoymmlOFuTqdgVZmrEtqo",
            authDomain: "drg-tyrant-bingo.firebaseapp.com",
            databaseURL: "https://drg-tyrant-bingo-default-rtdb.firebaseio.com",
            projectId: "drg-tyrant-bingo",
            storageBucket: "drg-tyrant-bingo.firebasestorage.app",
            messagingSenderId: "470680149909",
            appId: "1:470680149909:web:737039bc8dc9c883cfe09c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoresRef = ref(db, 'scores');

        const listContainer = document.getElementById('leaderboard-list');

        onValue(scoresRef, (snapshot) => {
            const data = snapshot.val();
            listContainer.innerHTML = '';

            if (!data) {
                listContainer.innerHTML = '<div class="empty-msg">No active players.</div>';
                return;
            }

            // Convert to array and sort by score descending
            const players = [];
            for (const [pseudo, info] of Object.entries(data)) {
                players.push({ pseudo, score: info.score, timestamp: info.timestamp });
            }

            players.sort((a, b) => b.score - a.score);

            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';
                
                const leftDiv = document.createElement('div');
                const rankSpan = document.createElement('span');
                rankSpan.className = 'rank';
                rankSpan.textContent = `#${index + 1}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'player-name';
                nameSpan.textContent = player.pseudo;

                leftDiv.appendChild(rankSpan);
                leftDiv.appendChild(nameSpan);

                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'player-score';
                scoreSpan.textContent = `${player.score} / 16`;

                row.appendChild(leftDiv);
                row.appendChild(scoreSpan);
                listContainer.appendChild(row);
            });
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm("Are you sure you want to delete all scores? This cannot be undone.")) {
                set(scoresRef, null);
            }
        });
    </script>
</body>
</html>
