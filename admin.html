<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bingo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            color: #e0f2fe;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        h1 {
            color: #ffd700;
            font-size: 3em;
            text-transform: uppercase;
            text-shadow: 0 0 20px #ffb703;
            margin-bottom: 20px;
        }

        /* Password Overlay */
        #password-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 3000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }

        #password-box {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 3px solid #ca6702; border-radius: 15px; padding: 40px;
            text-align: center; box-shadow: 0 0 40px rgba(202, 103, 2, 0.5);
            display: flex; flex-direction: column; align-items: center;
        }

        #password-box h2 { color: #ffb703; margin-top: 0; text-transform: uppercase; }
        #password-input {
            padding: 15px; font-size: 20px; border-radius: 5px; border: 2px solid #ca6702;
            background: #001219; color: white; outline: none; margin-bottom: 25px; text-align: center;
        }
        #password-box button {
            border-color: #ca6702; color: #ffb703;
            background: linear-gradient(135deg, #9b2226, #660708);
            box-shadow: 0 0 15px rgba(202, 103, 2, 0.5);
        }
        #password-box button:hover {
            background: linear-gradient(135deg, #ae2012, #9b2226);
            box-shadow: 0 0 25px rgba(202, 103, 2, 0.8);
        }

        /* Layout & Tabs */
        .tabs {
            display: flex; gap: 20px; margin-bottom: 30px;
        }
        .tab-btn {
            padding: 10px 20px; font-size: 18px; border: none; background: transparent;
            color: #00a8e8; cursor: pointer; font-weight: bold; text-transform: uppercase;
            border-bottom: 3px solid transparent; transition: all 0.3s;
        }
        .tab-btn.active {
            color: #ffd700; border-bottom: 3px solid #ffd700;
        }

        .section-container {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 3px solid #00a8e8; border-radius: 15px; padding: 30px;
            width: 100%; max-width: 600px;
            box-shadow: 0 0 40px rgba(0, 168, 232, 0.4);
            display: none; /* Hidden by default, toggled by JS */
        }
        .section-container.active {
            display: block;
        }

        /* Leaderboard Specifics */
        .player-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; margin-bottom: 15px;
            background: rgba(0, 168, 232, 0.1); border: 1px solid rgba(0, 168, 232, 0.3);
            border-radius: 8px; font-size: 1.2em; transition: all 0.3s ease;
            cursor: pointer;
        }
        .player-row:hover {
            background: rgba(0, 168, 232, 0.3); transform: translateX(5px);
        }
        .player-name { font-weight: bold; color: #ffffff; }
        .player-score { color: #ffd700; font-weight: bold; font-size: 1.4em; text-shadow: 0 0 10px #ffb703; }
        .rank { color: #00a8e8; margin-right: 15px; font-size: 1.2em; }
        .empty-msg { text-align: center; color: #8bb1c6; font-style: italic; }

        /* Challenges Specifics */
        .challenge-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; margin-bottom: 10px;
            background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
        }
        .challenge-text { color: #fff; }
        .btn-delete {
            background: #9b2226; color: white; border: none; padding: 5px 10px;
            border-radius: 3px; cursor: pointer; font-weight: bold;
        }
        .add-challenge-container {
            display: flex; gap: 10px; margin-top: 20px;
        }
        .add-challenge-container input {
            flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #00a8e8;
            background: #001219; color: white;
        }
        
        /* Grid Viewer Modal */
        #grid-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 2000;
            display: none; align-items: center; justify-content: center;
        }
        .grid-modal-content {
            background: #0d1b2a; border: 3px solid #00a8e8; padding: 30px;
            border-radius: 10px; max-width: 90vw; width: 500px;
        }
        .grid-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .grid-modal-header h2 { margin: 0; color: #ffd700; }
        .close-btn {
            background: none; border: none; color: white; font-size: 24px; cursor: pointer;
        }
        .preview-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
        }
        .preview-cell {
            background: #1b263b; border: 1px solid #00a8e8; aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 5px; font-size: 0.8em; color: #8bb1c6;
            word-wrap: break-word; overflow: hidden;
        }
        .preview-cell.checked {
            background: #00a8e8; color: #fff; font-weight: bold;
        }

        /* General Buttons */
        .actions { margin-top: 30px; display: flex; gap: 20px; justify-content: center;}
        button, a.btn {
            padding: 10px 20px; font-size: 16px; cursor: pointer;
            background: linear-gradient(135deg, #007ea7, #003459); color: #ffd700;
            border: 2px solid #00a8e8; border-radius: 5px; font-weight: bold;
            text-transform: uppercase; text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 168, 232, 0.5); transition: all 0.3s ease;
        }
        button:hover, a.btn:hover {
            background: linear-gradient(135deg, #00a8e8, #007ea7);
            transform: translateY(-2px);
        }
        #btn-reset {
            background: linear-gradient(135deg, #9b2226, #660708);
            border-color: #ca6702; color: #ffb703;
        }
    </style>
</head>
<body>
    <!-- Password Overlay -->
    <div id="password-overlay">
        <div id="password-box">
            <h2>Admin Access</h2>
            <input type="password" id="password-input" placeholder="Password...">
            <button onclick="checkPassword()">Login</button>
        </div>
    </div>

    <!-- Grid Viewer Modal -->
    <div id="grid-modal">
        <div class="grid-modal-content">
            <div class="grid-modal-header">
                <h2 id="modal-player-name">Player's Grid</h2>
                <button class="close-btn" onclick="closeGridModal()">&times;</button>
            </div>
            <div class="preview-grid" id="modal-grid"></div>
        </div>
    </div>

    <div id="admin-main" style="display: none; width: 100%; display: flex; flex-direction: column; align-items: center;">
        <h1 id="admin-title">Admin Dashboard</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('leaderboard')">Leaderboard</button>
            <button class="tab-btn" onclick="switchTab('challenges')">Manage Challenges</button>
        </div>

        <!-- Leaderboard Section -->
        <div id="section-leaderboard" class="section-container active">
            <div id="leaderboard-list">
                <div class="empty-msg">Waiting for players to join...</div>
            </div>
            <div class="actions">
                <button id="btn-reset">Reset All Scores</button>
            </div>
        </div>

        <!-- Challenges Section -->
        <div id="section-challenges" class="section-container">
            <div id="challenges-list">
                <div class="empty-msg">Loading challenges...</div>
            </div>
            <div class="add-challenge-container">
                <input type="text" id="new-challenge-input" placeholder="New challenge description...">
                <button onclick="addChallenge()">Add</button>
            </div>
        </div>

        <div class="actions">
            <a href="index.html" class="btn">Return to Game</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, child } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        let db;
        let globalChallenges = [];
        let globalPlayers = {};

        window.checkPassword = () => {
            const input = document.getElementById('password-input').value;
            if (input === 'Pj4Ever<3') {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('admin-main').style.display = 'flex';
                initFirebase();
            } else {
                alert('Access Denied: Incorrect Password');
            }
        };

        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.checkPassword();
        });

        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section-container').forEach(sec => sec.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('section-' + tabId).classList.add('active');
        };

        window.closeGridModal = () => {
            document.getElementById('grid-modal').style.display = 'none';
        };

        window.openGridModal = (pseudo) => {
            const player = globalPlayers[pseudo];
            if (!player || !player.grid) {
                alert("Grid data not available for this player yet.");
                return;
            }
            document.getElementById('modal-player-name').textContent = pseudo + "'s Grid";
            const gridContainer = document.getElementById('modal-grid');
            gridContainer.innerHTML = '';
            
            player.grid.forEach(cell => {
                const div = document.createElement('div');
                div.className = 'preview-cell' + (cell.checked ? ' checked' : '');
                div.textContent = cell.text;
                gridContainer.appendChild(div);
            });
            
            document.getElementById('grid-modal').style.display = 'flex';
        };

        window.addChallenge = () => {
            const input = document.getElementById('new-challenge-input');
            const val = input.value.trim();
            if (val) {
                globalChallenges.push(val);
                set(ref(db, 'config/challenges'), globalChallenges);
                input.value = '';
            }
        };

        window.deleteChallenge = (index) => {
            if(confirm("Delete this challenge?")) {
                globalChallenges.splice(index, 1);
                set(ref(db, 'config/challenges'), globalChallenges);
            }
        };

        function initFirebase() {
            const firebaseConfig = {
                apiKey: "AIzaSyCV_UpfbqOAW7EoymmlOFuTqdgVZmrEtqo",
                authDomain: "drg-tyrant-bingo.firebaseapp.com",
                databaseURL: "https://drg-tyrant-bingo-default-rtdb.firebaseio.com",
                projectId: "drg-tyrant-bingo",
                storageBucket: "drg-tyrant-bingo.firebasestorage.app",
                messagingSenderId: "470680149909",
                appId: "1:470680149909:web:737039bc8dc9c883cfe09c"
            };

            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            
            // Listen to Scores
            onValue(ref(db, 'scores'), (snapshot) => {
                const data = snapshot.val();
                globalPlayers = data || {};
                renderLeaderboard();
            });

            // Listen to Challenges
            onValue(ref(db, 'config/challenges'), (snapshot) => {
                globalChallenges = snapshot.val() || [];
                renderChallenges();
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                if (confirm("Are you sure you want to delete all scores? This cannot be undone.")) {
                    set(ref(db, 'scores'), null);
                }
            });
        }

        function renderLeaderboard() {
            const listContainer = document.getElementById('leaderboard-list');
            listContainer.innerHTML = '';

            if (Object.keys(globalPlayers).length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">No active players.</div>';
                return;
            }

            const playersArr = [];
            for (const [pseudo, info] of Object.entries(globalPlayers)) {
                playersArr.push({ pseudo, ...info });
            }
            playersArr.sort((a, b) => b.score - a.score);

            playersArr.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';
                row.onclick = () => openGridModal(player.pseudo);
                
                const leftDiv = document.createElement('div');
                leftDiv.innerHTML = `<span class="rank">#${index + 1}</span><span class="player-name">${player.pseudo}</span>`;

                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'player-score';
                scoreSpan.textContent = `${player.score} / 16`;

                row.appendChild(leftDiv);
                row.appendChild(scoreSpan);
                listContainer.appendChild(row);
            });
        }

        function renderChallenges() {
            const listContainer = document.getElementById('challenges-list');
            listContainer.innerHTML = '';

            if (globalChallenges.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">No challenges found.</div>';
                return;
            }

            globalChallenges.forEach((ch, index) => {
                const row = document.createElement('div');
                row.className = 'challenge-row';
                row.innerHTML = `<span class="challenge-text">${ch}</span>
                                 <button class="btn-delete" onclick="deleteChallenge(${index})">X</button>`;
                listContainer.appendChild(row);
            });
        }
    </script>
</body>
</html>
